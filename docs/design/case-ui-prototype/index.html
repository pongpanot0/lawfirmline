function toast(s){clearTimeout(timer);const el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');timer=setTimeout(()=>el.classList.add('hidden'),3200)}
function syncUrl(){history.replaceState({},'',`?variant=${variant}&page=${page}`)}
function setPage(p){page=p;activeTab='ภาพรวม';syncUrl();render();window.scrollTo(0,0)}
function changeVariant(d){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+d+3)%3];syncUrl();render();window.scrollTo(0,0)}
function input(label,key,placeholder='',type='text'){return `<div class="field"><label for="${key}">${label}</label><input id="${key}" type="${type}" value="${esc(state[key]||'')}" placeholder="${placeholder}" oninput="update('${key}',this.value)"></div>`}
function update(k,v){state[k]=v;if(k==='customer'&&state.same){state.client=v;const e=document.getElementById('client');if(e)e.value=v}updateSummary()}
function updateSummary(){document.querySelectorAll('[data-value]').forEach(e=>{const k=e.dataset.value;e.textContent=state[k]||'ยังไม่ระบุ'})}
function sidebar(){return `<aside class="sidebar" id="sidebar"><div class="brand row"><div class="brand-mark">S</div><strong class="latin">samnuan</strong><button class="mobile-close" aria-label="ปิดเมนู" onclick="document.getElementById('sidebar').classList.remove('open')">×</button></div><div class="office row"><span class="avatar">NS</span><div><b>นอร์ธสตาร์ ลอว์</b><div class="muted small">พื้นที่ทำงานสำนักงาน</div></div></div><div class="nav-label">พื้นที่ทำงาน</div>${[['grid','ภาพรวม'],['task','งานของฉัน'],['inbox','รับเรื่อง'],['case','คดี'],['people','ลูกค้าและลูกความ'],['calendar','ปฏิทิน'],['file','เอกสาร']].map(([i,t])=>`<button class="nav-item ${t==='คดี'?'active':''}" title="${t}" onclick="${t==='คดี'?"setPage('detail')":"toast('ตัวอย่างนี้แสดงเฉพาะหน้าสร้างคดีและรายละเอียดคดี')"}">${icon(i)}<span>${t}</span>${t==='คดี'?'<em>12</em>':''}</button>`).join('')}<div class="nav-label">สำนักงาน</div><button class="nav-item" title="รายงาน" onclick="toast('ตัวอย่างนี้แสดงเฉพาะหน้าคดี')">${icon('chart')}<span>รายงาน</span></button><div class="side-bottom row"><span class="avatar alt">อว</span><div class="stack"><b class="small">อรณิชา วัฒนกุล</b><span class="muted" style="font-size:10px">ทนายความ · เจ้าของสำนักงาน</span></div></div></aside>`}
function summary(){return `<aside class="summary-side"><h2>แฟ้มคดีที่กำลังเตรียม</h2><div class="docket"><div class="ref">NEW MATTER</div><h3 data-value="title">${esc(state.title)}</h3><span class="pill" data-value="type">${state.type}</span></div><div><div class="summary-line"><span>ผู้มอบหมาย</span><b data-value="customer">${esc(state.customer)}</b></div><div class="summary-line"><span>ลูกความ</span><b data-value="client">${esc(state.client)}</b></div><div class="summary-line"><span>ค่าใช้จ่าย</span><b>ยังไม่ได้ประมาณการ</b></div></div><div class="team-list"><div class="muted small">ผู้รับผิดชอบหลัก</div><div class="row"><span class="avatar alt">อว</span><div><b class="small" data-value="lawyer">${state.lawyer}</b><div class="muted" style="font-size:10px">กำลังดูแล 5 คดี</div></div></div></div><p class="note">${icon('info')}<span>เลขแฟ้มจะสร้างเมื่อยืนยันเปิดคดี<br>ข้อมูลศาลและเอกสารเพิ่มภายหลังได้</span></p></aside>`}
function createPage(){return `<div class="page-heading row between"><div><div class="eyebrow">NEW MATTER</div><h1>เริ่มต้นคดีใหม่</h1><p class="muted small">เริ่มจากข้อมูลที่มี แล้วค่อยเติมรายละเอียดระหว่างทำงาน</p></div><button class="btn" onclick="setPage('detail')">กลับหน้าคดี</button></div><div class="focus-steps">${['ข้อมูลคดี','ผู้เกี่ยวข้อง','ทีมและข้อมูลเสริม'].map((t,i)=>`<button class="${step===i?'active':''}" onclick="step=${i};render()">${i+1} &nbsp; ${t}</button>`).join('')}</div><div class="new-layout"><nav class="ledger-nav"><a href="#case-basic">ข้อมูลคดี</a><a href="#case-people">ผู้เกี่ยวข้อง</a><a href="#case-team">ทีมและข้อมูลเสริม</a></nav><form class="paper" onsubmit="event.preventDefault();nextCreate()"><section id="case-basic" class="form-section ${step===0?'focus-current':''}"><div class="section-head"><span class="section-num">01</span><div><h2>คดีนี้เกี่ยวกับอะไร</h2><p>เลือกประเภทและตั้งชื่อที่ทีมค้นหาเจอได้ง่าย</p></div></div><div class="fields"><div class="field full"><label>ประเภทคดี <span class="required">*</span></label><div class="type-picker">${['คดีแพ่ง','คดีอาญา','ครอบครัว','การแพทย์','อื่น ๆ'].map(t=>`<button type="button" class="type-option ${state.type===t?'selected':''}" aria-pressed="${state.type===t}" onclick="state.type='${t}';render()">${t}</button>`).join('')}</div></div><div class="full">${input('ชื่อคดี <span class="required">*</span>','title','เช่น เรียกชำระหนี้ — บริษัท ตัวอย่าง')}</div><p class="helper full">ใช้ชื่อเรื่องที่สื่อความ ไม่จำเป็นต้องมีเลขคดีตอนนี้</p></div></section><section id="case-people" class="form-section ${step===1?'focus-current':''}"><div class="section-head"><span class="section-num">02</span><div><h2>ใครเกี่ยวข้องกับคดีนี้</h2><p>แยกผู้มอบหมายงานออกจากผู้ที่เราว่าความให้</p></div></div><div class="fields">${input('ผู้มอบหมายงาน / ผู้จ่ายเงิน','customer')}${input('ผู้ติดต่อ','contact')}<label class="checkline full"><input type="checkbox" ${state.same?'checked':''} onchange="state.same=this.checked;if(state.same)state.client=state.customer;render()">ลูกความเป็นคนเดียวกับผู้มอบหมายงาน</label><div class="full">${input('ลูกความ / ผู้ที่เราว่าความให้','client')}</div></div></section><section id="case-team" class="form-section ${step===2?'focus-current':''}"><div class="section-head"><span class="section-num">03</span><div><h2>ทีมและรายละเอียดเพิ่มเติม</h2><p>เลือกคนดูแลหลัก ข้อมูลอื่นกลับมาเติมได้</p></div></div><div class="fields"><div class="field"><label for="lawyer">ทนายผู้รับผิดชอบ <span class="required">*</span></label><select id="lawyer" onchange="update('lawyer',this.value)">${['อรณิชา วัฒนกุล','ธนกร เจริญกิจ','ณัฐชา ศิริกุล'].map(t=>`<option ${t===state.lawyer?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="buddy">ทนายผู้ช่วย</label><select id="buddy" onchange="state.buddy=this.value"><option>ยังไม่มอบหมาย</option><option ${state.buddy==='ธนกร เจริญกิจ'?'selected':''}>ธนกร เจริญกิจ</option></select></div></div><div style="margin-top:21px"><details><summary>ศาลและหมายเลขคดี <span class="muted small">เพิ่มภายหลังได้</span></summary><div class="fields">${input('ศาล','court')}${input('เลขคดีดำ','number')}</div></details><details><summary>ทุนทรัพย์และรายละเอียดคดี</summary><div class="fields">${input('ทุนทรัพย์ (บาท)','amount','','number')}<div class="field full"><label for="description">รายละเอียด</label><textarea id="description" placeholder="สรุปข้อเท็จจริงเบื้องต้น" oninput="state.description=this.value">${esc(state.description||'')}</textarea></div></div></details></div></section><footer class="form-footer"><span class="helper">ข้อมูลจำลอง · ยังไม่สร้างคดีจริง</span><div class="row"><button type="button" class="link" onclick="${variant==='B'&&step>0?'step--;render()':"setPage('detail')"}">${variant==='B'&&step>0?'ย้อนกลับ':'ยกเลิก'}</button><button class="btn primary" type="submit">${variant==='B'&&step<2?'ถัดไป':'ตรวจสอบและสร้างคดี'} ${icon('arrow')}</button></div></footer></form>${summary()}</div>`}
function nextCreate(){if(!state.title.trim()){toast('กรุณาระบุชื่อคดี');document.getElementById('title')?.focus();return}if(variant==='B'&&step<2){step++;render();return}showReview()}
function showReview(){const m=document.getElementById('modal');m.innerHTML=`<div class="eyebrow">REVIEW MATTER</div><h2>ตรวจสอบก่อนเปิดแฟ้ม</h2><p class="muted small">ข้อมูลจำลอง ไม่มีการบันทึกเข้าระบบจริง</p>${[['ชื่อคดี',state.title],['ประเภทคดี',state.type],['ผู้มอบหมาย',state.customer],['ผู้ติดต่อ',state.contact],['ลูกความ',state.client],['ผู้รับผิดชอบ',state.lawyer],['ค่าใช้จ่าย','ยังไม่ได้ประมาณการ']].map(([k,v])=>`<div class="summary-line"><span>${k}</span><b>${esc(v||'ยังไม่ระบุ')}</b></div>`).join('')}<div class="modal-actions"><button class="btn" onclick="document.getElementById('modal').close()">กลับไปแก้ไข</button><button class="btn primary" onclick="document.getElementById('modal').close();setPage('detail');toast('เปิดแฟ้มตัวอย่างแล้ว — ไม่มีการสร้างข้อมูลจริง')">สร้างคดีตัวอย่าง ${icon('arrow')}</button></div>`;m.showModal()}
const tasks=[['จัดเตรียมบัญชีพยานและสำเนาเอกสาร','ธนกร เจริญกิจ · เตรียมขึ้นศาล','พรุ่งนี้'],['ตรวจคำแถลงก่อนวันนัด','อรณิชา วัฒนกุล · รอตรวจทาน','25 ก.ย.'],['ตรวจสอบหนังสือมอบอำนาจ','ณัฐชา ศิริกุล · เอกสารครบแล้ว','เสร็จแล้ว']];
function tasksHtml(){return `<section class="tasks"><div class="block-title"><h2>งานที่ต้องทำ <span class="muted small" id="taskcount">${state.completed.filter(x=>!x).length} งาน</span></h2><button class="link" onclick="addTask()">+ เพิ่มงาน</button></div>${tasks.map((t,i)=>`<label class="task-row"><input type="checkbox" aria-label="ทำเสร็จ: ${t[0]}" ${state.completed[i]?'checked':''} onchange="state.completed[${i}]=this.checked;document.getElementById('taskcount').textContent=state.completed.filter(x=>!x).length+' งาน'"><div><div class="task-name">${t[0]}</div><div class="task-description">${t[1]}</div></div><span class="due ${i?'later':''}">${t[2]}</span><span class="avatar ${i===1?'alt':''}">${i===0?'ธจ':i===1?'อว':'ณศ'}</span></label>`).join('')}</section>`}
function docsHtml(){return `<section><div class="block-title"><h2>เอกสารสำคัญ</h2><button class="link" onclick="activeTab='เอกสาร';render()">ดูเอกสารทั้งหมด ↗</button></div><div class="document-list">${[['สัญญาซื้อขาย.pdf','12 หน้า · เพิ่มเมื่อ 18 ก.ย.'],['หนังสือมอบอำนาจ.pdf','3 หน้า · เพิ่มเมื่อ 20 ก.ย.']].map(([a,b])=>`<button class="doc" onclick="showDocument('${a}')"><span class="doc-icon">${icon('file')}</span><span><strong>${a}</strong><small>${b}</small></span></button>`).join('')}</div></section>`}
function fileMeta(){return `<aside class="file-meta"><div class="block-title"><h2>ข้อมูลแฟ้ม</h2><button class="link" onclick="setPage('create')">แก้ไข</button></div>${[['ลูกความ',state.client],['ผู้มอบหมาย',state.customer],['ศาล',state.court],['เลขคดีดำ',state.number],['ทุนทรัพย์',Number(state.amount||0).toLocaleString('th-TH')+' บาท']].map(([a,b])=>`<div class="summary-line"><span>${a}</span><b>${esc(b||'ยังไม่ระบุ')}</b></div>`).join('')}<div style="margin-top:20px"><h3 class="small">ทีมของคดี</h3><div class="row" style="margin-top:12px"><span class="avatar alt">อว</span><div><b class="small">${esc(state.lawyer)}</b><div class="muted" style="font-size:10px">ผู้รับผิดชอบหลัก</div></div></div><div class="row" style="margin-top:12px"><span class="avatar">ธจ</span><div><b class="small">ธนกร เจริญกิจ</b><div class="muted" style="font-size:10px">ทนายผู้ช่วย</div></div></div></div></aside>`}
function activity(){return `<section style="margin-top:29px"><div class="block-title"><h2>ความเคลื่อนไหวล่าสุด</h2><span class="muted small">กันยายน 2569</span></div><div class="timeline"><div class="event">ธนกรเพิ่มหนังสือมอบอำนาจ<small>20 ก.ย. · 14:32 น. · เอกสาร</small></div><div class="event">บันทึกวันนัดชี้สองสถาน<small>19 ก.ย. · 10:15 น. · นัดหมาย</small></div><div class="event">ยื่นคำฟ้องต่อศาลแพ่งกรุงเทพใต้<small>18 ก.ย. · 09:40 น. · ขั้นตอนคดี</small></div></div></section>`}
function panel(){if(activeTab==='ภาพรวม')return tasksHtml()+docsHtml()+activity();if(activeTab==='งาน')return tasksHtml();if(activeTab==='เอกสาร')return docsHtml();if(activeTab==='ความเคลื่อนไหว')return activity();return `<section class="empty-panel"><h2>ค่าใช้จ่ายของคดี</h2><p class="muted small" style="margin:8px 0 24px">ยังไม่ได้ประมาณการค่าใช้จ่าย</p><div class="summary-line"><span>ค่าธรรมเนียมศาล</span><b>17,000 บาท</b></div><div class="summary-line"><span>ค่าจัดส่งเอกสาร</span><b>250 บาท</b></div><div class="summary-line"><span>รวมค่าใช้จ่ายตัวอย่าง</span><b>17,250 บาท</b></div></section>`}
function detailPage(){return `<div class="detail-heading"><div><div class="row"><span class="eyebrow" style="margin:0">MATTER &nbsp; 2569 / 0042</span><span class="pill green"><i class="dot"></i>ยื่นฟ้องแล้ว</span></div><h1>${esc(state.title)}</h1><div class="case-meta"><span>${esc(state.client)}</span><span>·</span><span>${state.type}</span><span>·</span><span>เปิดแฟ้ม 18 ก.ย. 2569</span></div></div><button class="btn" onclick="manageCase()">${icon('settings')}<span>จัดการคดี</span></button></div><section class="next-action"><div class="date-block"><strong>27</strong><span>ก.ย. 2569</span></div><div><div class="eyebrow" style="margin-bottom:0">นัดถัดไป · อีก 5 วัน</div><h2>นัดชี้สองสถาน</h2><p>09:00 น. &nbsp; · &nbsp; ${esc(state.court)} &nbsp; · &nbsp; ห้อง 402</p></div><button class="btn" onclick="prepareCourt()">เตรียมขึ้นศาล ${icon('arrow')}</button></section><div class="detail-layout"><nav class="tabs" aria-label="ส่วนของคดี">${['ภาพรวม','งาน','เอกสาร','ความเคลื่อนไหว','ค่าใช้จ่าย'].map(t=>`<button class="tab ${t===activeTab?'active':''}" aria-current="${t===activeTab?'page':'false'}" onclick="activeTab='${t}';render()">${t}${t==='งาน'?'<span>3</span>':t==='เอกสาร'?'<span>2</span>':''}</button>`).join('')}</nav><div class="detail-grid"><main class="work-main">${panel()}</main>${fileMeta()}</div></div>`}
function prepareCourt(){const m=document.getElementById('modal');m.innerHTML=`<div class="eyebrow">COURT DAY · 27 SEP</div><h2>เตรียมพร้อมก่อนขึ้นศาล</h2><p class="muted small">นัดชี้สองสถาน · 09:00 น. · ห้อง 402</p><div style="margin-top:20px">${['หนังสือมอบอำนาจฉบับจริง','บัญชีพยานและสำเนาเอกสาร','ประเด็นที่ต้องแถลงต่อศาล'].map(t=>`<label class="task-row"><input type="checkbox"><span>${t}</span></label>`).join('')}</div><div class="modal-actions"><button class="btn primary" onclick="document.getElementById('modal').close()">กลับหน้าคดี</button></div>`;m.showModal()}
function showDocument(name){const m=document.getElementById('modal');m.innerHTML=`<div class="row between"><h2>${name}</h2><button aria-label="ปิดเอกสาร" onclick="document.getElementById('modal').close()">×</button></div><div style="background:var(--bg);padding:35px 25px;margin-top:20px;border:1px solid var(--line);min-height:240px"><p class="eyebrow">DOCUMENT PREVIEW</p><h2 style="margin-top:24px">${name.replace('.pdf','')}</h2><hr class="section-separator"><p class="muted">พื้นที่แสดงเอกสารของคดี</p><p class="muted small" style="margin-top:12px">นี่เป็นเอกสารจำลองสำหรับทดลองหน้าตา<br>ไม่ได้ดึงเอกสารจริงหรือวิเคราะห์ด้วย AI</p></div>`;m.showModal()}
function addTask(){const m=document.getElementById('modal');m.innerHTML=`<h2>เพิ่มงานในคดี</h2><form onsubmit="event.preventDefault();const v=document.getElementById('newtask').value.trim();if(!v)return;tasks.push([v,'อรณิชา วัฒนกุล · งานใหม่','ยังไม่กำหนด']);state.completed.push(false);document.getElementById('modal').close();render();toast('เพิ่มงานในตัวอย่างแล้ว')"><label for="newtask">ชื่องาน</label><input id="newtask" required style="margin-top:8px" placeholder="เช่น เตรียมคำแถลง"><div class="modal-actions"><button type="button" class="btn" onclick="document.getElementById('modal').close()">ยกเลิก</button><button class="btn primary">เพิ่มงาน</button></div></form>`;m.showModal()}
function manageCase(){const m=document.getElementById('modal');m.innerHTML=`<h2>จัดการคดี</h2><p class="muted small">การทำงานในตัวอย่าง ไม่มีผลกับคดีจริง</p><div class="stack" style="margin-top:20px"><button class="btn" onclick="document.getElementById('modal').close();setPage('create')">แก้ไขข้อมูลคดี</button><button class="btn" onclick="toast('ตัวอย่าง: ขั้นตอนปัจจุบันคือยื่นฟ้องแล้ว')">เปลี่ยนขั้นตอนคดี</button><button class="btn" onclick="toast('ตัวอย่าง: ต้องตรวจงานค้างและสรุปผลก่อนปิดคดี')">ตรวจสอบก่อนปิดคดี</button></div><div class="modal-actions"><button class="link" onclick="document.getElementById('modal').close()">กลับ</button></div>`;m.showModal()}
function render(){document.body.dataset.variant=variant;document.getElementById('app').innerHTML=`${sidebar()}<div class="shell"><header class="topbar"><div class="row"><button class="mobile-menu" aria-label="เปิดเมนู" onclick="document.getElementById('sidebar').classList.add('open')">${icon('menu')}</button><div class="crumb">พื้นที่ทำงาน &nbsp; / &nbsp; คดี &nbsp; / &nbsp; <b>${page==='create'?'สร้างคดีใหม่':'รายละเอียดคดี'}</b></div><span class="preview-tag">MOCKUP · ข้อมูลจำลอง</span></div><div class="row top-actions"><button class="search-action" aria-label="ค้นหา" onclick="toast('ตัวอย่างนี้ใช้ข้อมูลคดีจำลอง')">${icon('search')}</button><button aria-label="การแจ้งเตือน" onclick="toast('ไม่มีการแจ้งเตือนในตัวอย่าง')">${icon('bell')}</button><span class="avatar alt">อว</span></div></header><div class="workspace">${page==='create'?createPage():detailPage()}</div></div><div class="variant-switcher" aria-label="เลือกแบบ mockup"><button aria-label="แบบก่อนหน้า" onclick="changeVariant(-1)">←</button><span class="variant-label">${variant} · ${names[variant]}</span><button aria-label="แบบถัดไป" onclick="changeVariant(1)">→</button><div class="switch-pages"><button class="${page==='create'?'active':''}" onclick="setPage('create')">สร้างคดี</button><button class="${page==='detail'?'active':''}" onclick="setPage('detail')">รายละเอียด</button></div></div>`}
document.addEventListener('keydown',e=>{if(document.getElementById('modal').open||e.target.matches('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();changeVariant(e.key==='ArrowRight'?1:-1)}});render();
</script><script src="source-data.js"></script><script src="complete-data.js"></script><script src="detail-workflow.js"></script><script src="billing-timeline.js"></script><script src="facts-refined.js"></script></body></html>
