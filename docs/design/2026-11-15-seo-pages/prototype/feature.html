      <p class="mt-3 text-ink-2">ข้อมูลส่งต่อกันทั้งระบบ คลิกดูขั้นตอนอื่นได้</p>
    </div>
    <div class="reveal">${tourHTML(key)}</div>
  </section>

  <section class="mx-auto max-w-[860px] px-4 reveal">
    <h2 class="mb-6 text-center font-display text-3xl font-semibold">คำถามที่พบบ่อย</h2>
    <div class="divide-y divide-rule border-y border-rule">
      ${P.faq.map(([q, a]) => `<details class="group py-5"><summary class="flex items-center justify-between gap-4 font-medium text-ink">${q}<span class="chev text-ink-2" aria-hidden="true">⌄</span></summary><p class="mt-3 leading-relaxed text-ink-2">${a}</p></details>`).join('')}
    </div>
  </section>
  ${ctaHTML(P.cta)}`;
document.getElementById('footer').innerHTML = footerHTML();

initTour(document.querySelector('.tour'), { autoplay: false });
initReveal();

/* Court-fee estimate: same rule as packages/shared estimateCourtFee (general civil + exempt cases). */
const amt = document.getElementById('amt');
if (amt) {
  const kind = document.getElementById('kind'), fee = document.getElementById('fee');
  const calc = () => {
    const n = Number(amt.value.replace(/[^\d]/g, '')) || 0;
    const head = Math.min(Math.min(n, 50e6) * 0.02, 200000);
    const v = kind.value === 'exempt' ? 0 : Math.round(head + Math.max(0, n - 50e6) * 0.001);
    fee.textContent = v.toLocaleString('th-TH');
    fee.parentElement.animate?.([{ opacity: .4 }, { opacity: 1 }], { duration: 220 });
  };
  amt.addEventListener('input', () => { const d = amt.value.replace(/[^\d]/g, ''); amt.value = d ? Number(d).toLocaleString('th-TH') : ''; calc(); });
  kind.addEventListener('change', calc); calc();
}
</script>
</body>
</html>
