<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LexFlow · กำลังเข้าสู่ระบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="portal-shared.css" />
</head>
<body>

<div class="auth-shell">

  <!-- State 1: verifying (default visible) -->
  <div class="card auth-card auth-center" id="state-loading">
    <div class="auth-icon-circle spin">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
    </div>
    <h1 class="auth-title">กำลังเข้าสู่ระบบ...</h1>
    <p class="auth-sub">กรุณารอสักครู่ ระบบกำลังตรวจสอบลิงก์ของท่าน</p>
  </div>

  <!-- State 2: error (toggle via JS in the real build — shown here for reference) -->
  <div class="card auth-card auth-center" id="state-error" style="display:none;">
    <div class="auth-icon-circle warn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
    </div>
    <h1 class="auth-title">ลิงก์นี้ไม่ถูกต้องหรือหมดอายุแล้ว</h1>
    <p class="auth-sub">ลิงก์เข้าสู่ระบบใช้ได้ครั้งเดียวและหมดอายุภายใน 15 นาที กรุณาขอลิงก์ใหม่</p>
    <a class="btn btn-primary btn-block" href="login.html">ขอลิงก์ใหม่</a>
  </div>

</div>

</body>
</html>
