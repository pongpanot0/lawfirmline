# Production deploy: API + Web behind a Caddy reverse proxy (Postgres via RDS)
# with automatic HTTPS. Images are pulled from ECR (built by GitHub Actions).
#
# Setup:
#   1. cp .env.production.example .env   # then fill in real values (DATABASE_URL = RDS)
#   2. Point DOMAIN's DNS A records (apex, api.DOMAIN, thesiambarrister.DOMAIN)
#      at this VPS's IP first — Caddy needs that for TLS certificates.
#   3. aws ecr get-login-password --region ap-southeast-7 \
#        | docker login --username AWS --password-stdin $ECR_REGISTRY
#   4. docker compose -f docker-compose.prod.yml pull
#   5. docker compose -f docker-compose.prod.yml up -d
#   6. docker compose -f docker-compose.prod.yml exec api pnpm prisma migrate deploy
#   7. docker compose -f docker-compose.prod.yml exec api pnpm prisma db seed   # optional
#
# Local rebuild (not recommended on t4g.small):
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  api:
    image: ${ECR_REGISTRY}/lawfirm-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-southeast-7}
      AWS_REGION: ${S3_REGION:-ap-southeast-7}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_PORTAL_JWT_SECRET: ${CLIENT_PORTAL_JWT_SECRET}
      CORS_ORIGIN: https://${DOMAIN},https://www.${DOMAIN},https://thesiambarrister.${DOMAIN}
      ROOT_DOMAIN: ${DOMAIN}
      APP_URL: https://${DOMAIN}
      UPLOAD_DIR: /data/uploads
      PORT: 3001
      HOST: 0.0.0.0
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-LexFlow}
      CLIENT_PORTAL_EXPOSE_DEV_TOKEN: "false"
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      OMISE_PUBLIC_KEY: ${OMISE_PUBLIC_KEY:-}
      OMISE_SECRET_KEY: ${OMISE_SECRET_KEY:-}
      OMISE_MOCK: ${OMISE_MOCK:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      IAPP_API_KEY: ${IAPP_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - uploads:/data/uploads
    networks: [internal]

  web:
    image: ${ECR_REGISTRY}/lawfirm-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_ROOT_DOMAIN: ${DOMAIN}
    restart: unless-stopped
    depends_on:
      - api
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks: [internal]

networks:
  internal:

volumes:
  uploads:
  caddy_data:
  caddy_config:
