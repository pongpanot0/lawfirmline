services:
  postgres:
    # pgvector/pgvector = official postgres image + pgvector extension,
    # required by the RAG DocumentChunk table. Same PG16 data format.
    image: pgvector/pgvector:pg16
    container_name: lawfirm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lawfirm
      POSTGRES_PASSWORD: lawfirm
      POSTGRES_DB: lawfirm
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
