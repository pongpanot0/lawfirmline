services:
  postgres:
    image: postgres:16-alpine
    container_name: lawfirm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lawfirm
      POSTGRES_PASSWORD: lawfirm
      POSTGRES_DB: lawfirm
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
