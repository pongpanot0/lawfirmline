[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @lawfirm/shared build && pnpm --filter web build"
watchPatterns = [
  "/apps/web/**",
  "/packages/shared/**",
  "/pnpm-lock.yaml",
  "/package.json",
]

[deploy]
startCommand = "pnpm --filter web start"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
